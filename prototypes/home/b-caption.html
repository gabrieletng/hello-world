<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option B — Title caption</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }

    .marquee {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 34vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: grab;
    }
    .marquee.top    { top: 0; }
    .marquee.bottom { bottom: 0; }
    body.dragging, body.dragging .marquee { cursor: grabbing; }

    .track {
      display: flex;
      gap: 2.2vw;
      padding: 0 1.1vw;
      flex-shrink: 0;
      will-change: transform;
    }
    .track img {
      height: 32vh; width: auto; display: block; flex-shrink: 0;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
    }

    #center-text {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    body { opacity: 0; transition: opacity 1.6s ease; }
    body.ready { opacity: 1; }

    /* ─── Option B: caption under title ──────────────────── */
    #portal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(clamp(2.4rem, 5vw, 5rem) * 1.15));
      z-index: 11;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.85rem, 1.1vw, 1.05rem);
      letter-spacing: 0.28em;
      color: rgba(0,0,0,0.38);
      text-decoration: none;
      white-space: nowrap;
      padding: 12px 18px;
      opacity: 0;
      transition: color 0.25s, opacity 1s ease;
    }
    body.ready #portal { opacity: 1; transition-delay: 1.4s; }
    #portal:hover { color: rgba(0,0,0,0.9); }

    #portal .divider {
      display: inline-block;
      width: 28px;
      height: 1px;
      background: currentColor;
      vertical-align: middle;
      margin: 0 14px 3px 0;
      opacity: 0.6;
    }
    #portal .arrow {
      display: inline-block;
      margin-left: 10px;
      animation: drift 2.6s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="marquee top"><div class="track" id="track-top"></div></div>
  <div class="marquee bottom"><div class="track" id="track-bottom"></div></div>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <a id="portal" href="../../explore/grid.html">
    <span class="divider"></span>AND EVERYTHING ELSE<span class="arrow">&rarr;</span>
  </a>

  <script src="../../js/marquee.js"></script>

        "../../images/kemal-sanli.webp",
        "../../images/mark-busch.webp",
      ]
    });
  </script>
</body>
</html>
