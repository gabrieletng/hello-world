<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Option A — Corner Pill</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }

    .marquee {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 34vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: grab;
    }
    .marquee.top    { top: 0; }
    .marquee.bottom { bottom: 0; }
    body.dragging, body.dragging .marquee { cursor: grabbing; }

    .track {
      display: flex;
      gap: 2.2vw;
      padding: 0 1.1vw;
      flex-shrink: 0;
      will-change: transform;
    }
    .track img {
      height: 32vh; width: auto; display: block; flex-shrink: 0;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
    }

    #center-text {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    body { opacity: 0; transition: opacity 1.6s ease; }
    body.ready { opacity: 1; }

    /* ─── Option A: corner pill ─────────────────────────── */
    #portal {
      position: fixed;
      top: 22px; right: 22px;
      z-index: 20;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 0.22em;
      color: #111;
      padding: 10px 18px 9px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(-6px);
      transition: background 0.2s, color 0.2s, border-color 0.2s,
                  box-shadow 0.2s, opacity 0.9s ease, transform 0.9s ease;
    }
    body.ready #portal { opacity: 1; transform: translateY(0); transition-delay: 1.1s, 1.1s; }
    #portal:hover {
      background: #000; color: #fff; border-color: #000;
      box-shadow: 0 8px 26px rgba(0,0,0,0.28);
    }
    #portal .arrow { display: inline-block; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="marquee top"><div class="track" id="track-top"></div></div>
  <div class="marquee bottom"><div class="track" id="track-bottom"></div></div>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <a id="portal" href="../../explore/grid.html">THE COLLECTION<span class="arrow">&rarr;</span></a>

      ]
    });

</body>
</html>
