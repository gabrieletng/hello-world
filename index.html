<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Story of Love and Death</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    #center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    .slot {
      position: fixed;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity   1.8s cubic-bezier(0.22, 1, 0.36, 1),
        transform 2.0s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .slot.visible {
      opacity: 1;
      transform: scale(1);
    }

    .slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <script>
    const SRCS = [
      "16884654318215563291720051695677.jpg",
      "1711998625011364017473959676309.jpg",
      "17165775964166598959802942392100.jpg",
      "@camdenthrasher.png",
      "@davidemessora.png",
      "@retroracing_culture.jpg",
      "custom-harley-xr1200-16.jpg.webp",
      "custom-harley-xr1200-19.jpg.webp",
      "custom-harley-xr1200-2.jpg.webp",
      "custom-harley-xr1200.jpg",
      "kemalSanli.jpg",
      "mark busch.jpg"
    ];

    // Preload so fade-ins never flash.
    SRCS.forEach(s => { const i = new Image(); i.src = s; });

    // Editorial composition: 8 slots around the center text.
    // Mixed aspect ratios (portrait / landscape / square) to feel curated
    // rather than gridded. Center band kept clear for the title.
    const SLOTS = [
      { x: 0.030, y: 0.050, w: 0.200, h: 0.300 }, // top-left, portrait
      { x: 0.415, y: 0.030, w: 0.200, h: 0.180 }, // top-center, landscape
      { x: 0.775, y: 0.070, w: 0.200, h: 0.240 }, // top-right, landscape
      { x: 0.020, y: 0.400, w: 0.140, h: 0.260 }, // left-middle, portrait
      { x: 0.840, y: 0.420, w: 0.140, h: 0.220 }, // right-middle, portrait
      { x: 0.040, y: 0.720, w: 0.220, h: 0.240 }, // bottom-left, landscape
      { x: 0.400, y: 0.770, w: 0.200, h: 0.200 }, // bottom-center, square
      { x: 0.760, y: 0.700, w: 0.200, h: 0.270 }, // bottom-right, portrait
    ];

    const active = new Map(); // slotIdx -> { src, el }

    const usedSrcs = () => new Set([...active.values()].map(a => a.src));

    function pickSrc() {
      const used = usedSrcs();
      const pool = SRCS.filter(s => !used.has(s));
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }

    function fillSlot(slotIdx) {
      if (active.has(slotIdx)) return;
      const src = pickSrc();
      if (!src) return;

      const s = SLOTS[slotIdx];
      const el = document.createElement('div');
      el.className = 'slot';
      el.style.left   = (s.x * 100) + '%';
      el.style.top    = (s.y * 100) + '%';
      el.style.width  = (s.w * 100) + '%';
      el.style.height = (s.h * 100) + '%';

      const img = document.createElement('img');
      img.src = src;
      el.appendChild(img);
      document.body.appendChild(el);

      active.set(slotIdx, { src, el });

      const reveal = () => requestAnimationFrame(() =>
        requestAnimationFrame(() => el.classList.add('visible'))
      );
      if (img.complete) reveal();
      else img.addEventListener('load', reveal, { once: true });
    }

    function clearSlot(slotIdx) {
      const a = active.get(slotIdx);
      if (!a) return;
      a.el.classList.remove('visible');
      active.delete(slotIdx);
      const toRemove = a.el;
      setTimeout(() => toRemove.remove(), 2200); // after fade-out completes
    }

    // Initial reveal: one image at a time, in a random order.
    // Paced so the experience feels like pages being turned.
    const order = SLOTS.map((_, i) => i).sort(() => Math.random() - 0.5);
    const FIRST_DELAY = 1100;   // time the title sits alone on white
    const STEP        = 1100;   // time between successive reveals
    order.forEach((slotIdx, i) => {
      setTimeout(() => fillSlot(slotIdx), FIRST_DELAY + i * STEP);
    });

    // After all slots are filled, drift into a calm cycling rhythm:
    // one slot at a time fades out, pauses, then another image fades in.
    const cycleStart = FIRST_DELAY + order.length * STEP + 2500;
    function cycle() {
      const filled = [...active.keys()];
      if (filled.length) {
        const slotIdx = filled[Math.floor(Math.random() * filled.length)];
        clearSlot(slotIdx);
        setTimeout(() => fillSlot(slotIdx), 2400); // fade-out + short breath
      }
      setTimeout(cycle, 5500 + Math.random() * 3000); // 5.5–8.5s between swaps
    }
    setTimeout(cycle, cycleStart);
  </script>
</body>
</html>
