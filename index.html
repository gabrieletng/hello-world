<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Story of Love and Death</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }

    .marquee {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 34vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: grab;
    }
    .marquee.top    { top: 0; }
    .marquee.bottom { bottom: 0; }

    body.dragging,
    body.dragging .marquee { cursor: grabbing; }

    .track {
      display: flex;
      gap: 2.2vw;
      padding: 0 1.1vw;
      flex-shrink: 0;
      will-change: transform;
    }
    .track img {
      height: 32vh;
      width: auto;
      display: block;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    body { opacity: 0; transition: opacity 1.6s ease; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="marquee top"><div class="track" id="track-top"></div></div>
  <div class="marquee bottom"><div class="track" id="track-bottom"></div></div>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <script>
    const SRCS = [
      "16884654318215563291720051695677.jpg",
      "1711998625011364017473959676309.jpg",
      "17165775964166598959802942392100.jpg",
      "@camdenthrasher.png",
      "@davidemessora.png",
      "@retroracing_culture.jpg",
      "custom-harley-xr1200-16.jpg.webp",
      "custom-harley-xr1200-19.jpg.webp",
      "custom-harley-xr1200-2.jpg.webp",
      "custom-harley-xr1200.jpg",
      "kemalSanli.jpg",
      "mark busch.jpg"
    ];

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildTrack(el, srcs) {
      srcs.concat(srcs).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.decoding = 'async';
        img.loading  = 'eager';
        el.appendChild(img);
      });
    }

    const pool = shuffled(SRCS);
    const trackTop = document.getElementById('track-top');
    const trackBot = document.getElementById('track-bottom');
    buildTrack(trackTop, pool.slice(0, 6));
    buildTrack(trackBot, pool.slice(6));

    // ─── Motion model ────────────────────────────────────────────────────────
    //
    // topOff / botOff are ever-increasing accumulators (px).
    //
    //   top transform  = -(topOff % topHW)         → drifts LEFT  at topSpeed
    //   bot transform  =  (botOff % botHW) - botHW → drifts RIGHT at botSpeed
    //
    // During drag, the accumulators freeze. `drag` (cursor Δx) is applied to
    // both in the same direction so their relative movement is reciprocal:
    //
    //   top effective  = topOff - drag  →  drag right  = top shifts right
    //   bot effective  = botOff - drag  →  drag right  = bot shifts left
    //
    // On release: drag is baked into the accumulators (no position jump),
    // auto-scroll resumes immediately at the same idle speed.
    //
    // Speeds are derived from the track half-width and the original CSS
    // durations so the idle pace matches exactly what it was before.
    // ─────────────────────────────────────────────────────────────────────────

    const TOP_DURATION = 95;   // seconds — matches the old CSS animation
    const BOT_DURATION = 115;

    let topHW = 1, botHW = 1;
    let topSpeed = 0, botSpeed = 0;
    let topOff = 0, botOff = 0;

    // Drag state
    let dragging   = false;
    let drag       = 0;      // live Δx from drag-start
    let dragStartX = 0;

    function applyTransform() {
      const topEff = topOff - drag;
      const botEff = botOff - drag;
      const t = -(((topEff % topHW) + topHW) % topHW);
      const b =  (((botEff % botHW) + botHW) % botHW) - botHW;
      trackTop.style.transform = `translateX(${t}px)`;
      trackBot.style.transform = `translateX(${b}px)`;
    }

    // ─── Pointer handlers ─────────────────────────────────────────────────────
    function pDown(x) {
      dragging   = true;
      dragStartX = x;
      drag       = 0;
      document.body.classList.add('dragging');
    }

    function pMove(x) {
      if (!dragging) return;
      drag = x - dragStartX;
    }

    function pUp() {
      if (!dragging) return;
      dragging = false;
      // Bake current drag into accumulators so position doesn't jump.
      topOff -= drag;
      botOff -= drag;
      drag = 0;
      document.body.classList.remove('dragging');
    }

    document.addEventListener('mousedown',  e => { e.preventDefault(); pDown(e.clientX); });
    document.addEventListener('mousemove',  e => pMove(e.clientX));
    document.addEventListener('mouseup',    ()  => pUp());
    document.addEventListener('mouseleave', ()  => pUp());

    document.addEventListener('touchstart', e => pDown(e.touches[0].clientX),         { passive: true });
    document.addEventListener('touchmove',  e => pMove(e.touches[0].clientX),         { passive: true });
    document.addEventListener('touchend',   ()  => pUp());

    // ─── Animation loop ───────────────────────────────────────────────────────
    let lastT = 0;

    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      // Accumulators only advance when not grabbing.
      if (!dragging) {
        topOff += topSpeed * dt;
        botOff += botSpeed * dt;
      }

      applyTransform();
      requestAnimationFrame(frame);
    }

    // ─── Init ─────────────────────────────────────────────────────────────────
    const allImgs = [...document.querySelectorAll('.track img')];
    Promise.all(allImgs.map(img =>
      img.decode().catch(() => new Promise(res => {
        img.addEventListener('load',  res, { once: true });
        img.addEventListener('error', res, { once: true });
      }))
    )).then(() => {
      topHW    = trackTop.scrollWidth / 2;
      botHW    = trackBot.scrollWidth / 2;
      // Derive px/s from track width ÷ duration → same visual pace as the CSS was.
      topSpeed = topHW / TOP_DURATION;
      botSpeed = botHW / BOT_DURATION;
      document.body.classList.add('ready');
      requestAnimationFrame(t => { lastT = t; frame(t); });
    });

    setTimeout(() => document.body.classList.add('ready'), 4000);
  </script>
</body>
</html>
