<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Story of Love and Death</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    .marquee {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 34vh;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .marquee.top    { top: 0; }
    .marquee.bottom { bottom: 0; }

    .track {
      display: flex;
      gap: 2.2vw;
      padding: 0 1.1vw;
      flex-shrink: 0;
      will-change: transform;
    }

    /* Each track holds its subset duplicated twice; translating -50% lands
       exactly on the start of the second copy = seamless loop. The two bands
       move in opposite directions at different speeds. */
    .marquee.top .track    { animation: scroll-left  95s linear infinite; }
    .marquee.bottom .track { animation: scroll-right 115s linear infinite; }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    .track img {
      height: 32vh;
      width: auto;     /* natural aspect ratio — no cropping */
      display: block;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    #center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    body { opacity: 0; transition: opacity 1.6s ease; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="marquee top"><div class="track" id="track-top"></div></div>
  <div class="marquee bottom"><div class="track" id="track-bottom"></div></div>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <script>
    const SRCS = [
      "16884654318215563291720051695677.jpg",
      "1711998625011364017473959676309.jpg",
      "17165775964166598959802942392100.jpg",
      "@camdenthrasher.png",
      "@davidemessora.png",
      "@retroracing_culture.jpg",
      "custom-harley-xr1200-16.jpg.webp",
      "custom-harley-xr1200-19.jpg.webp",
      "custom-harley-xr1200-2.jpg.webp",
      "custom-harley-xr1200.jpg",
      "kemalSanli.jpg",
      "mark busch.jpg"
    ];

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildTrack(el, srcs) {
      // Duplicate the subset so the -50% translate produces a seamless loop.
      srcs.concat(srcs).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.decoding = 'async';
        img.loading = 'eager';
        el.appendChild(img);
      });
    }

    // Split the pool into two disjoint halves so the same image can never
    // appear in both bands at the same time.
    const pool = shuffled(SRCS);
    buildTrack(document.getElementById('track-top'),    pool.slice(0, 6));
    buildTrack(document.getElementById('track-bottom'), pool.slice(6));

    const all = [...document.querySelectorAll('.track img')];
    Promise.all(all.map(img =>
      img.decode().catch(() => new Promise(res => {
        img.addEventListener('load',  res, { once: true });
        img.addEventListener('error', res, { once: true });
      }))
    )).then(() => document.body.classList.add('ready'));
    setTimeout(() => document.body.classList.add('ready'), 4000);
  </script>
</body>
</html>
