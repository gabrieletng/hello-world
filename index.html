<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Story of Love and Death</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }

    .marquee {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 34vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: grab;
    }
    .marquee.top    { top: 0; }
    .marquee.bottom { bottom: 0; }

    body.dragging,
    body.dragging .marquee { cursor: grabbing; }

    .track {
      display: flex;
      gap: 2.2vw;
      padding: 0 1.1vw;
      flex-shrink: 0;
      will-change: transform;
    }
    .track img {
      height: 32vh;
      width: auto;
      display: block;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 5vw, 5rem);
      color: #000;
      text-align: center;
      line-height: 1.0;
      letter-spacing: 0.06em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    body { opacity: 0; transition: opacity 1.6s ease; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  <div class="marquee top"><div class="track" id="track-top"></div></div>
  <div class="marquee bottom"><div class="track" id="track-bottom"></div></div>
  <div id="center-text">THIS IS A STORY OF<br>LOVE AND DEATH</div>

  <script>
    const SRCS = [
      "16884654318215563291720051695677.jpg",
      "1711998625011364017473959676309.jpg",
      "17165775964166598959802942392100.jpg",
      "@camdenthrasher.png",
      "@davidemessora.png",
      "@retroracing_culture.jpg",
      "custom-harley-xr1200-16.jpg.webp",
      "custom-harley-xr1200-19.jpg.webp",
      "custom-harley-xr1200-2.jpg.webp",
      "custom-harley-xr1200.jpg",
      "kemalSanli.jpg",
      "mark busch.jpg"
    ];

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildTrack(el, srcs) {
      // Two copies of the subset for seamless loop.
      srcs.concat(srcs).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.decoding = 'async';
        img.loading  = 'eager';
        el.appendChild(img);
      });
    }

    const pool = shuffled(SRCS);
    const trackTop = document.getElementById('track-top');
    const trackBot = document.getElementById('track-bottom');
    buildTrack(trackTop, pool.slice(0, 6));
    buildTrack(trackBot, pool.slice(6));

    // ─── Motion model ───────────────────────────────────────────────────────
    // topOff and botOff are ever-increasing accumulators (px).
    //
    //   top transform  = -(topOff % topHW)         → drifts left
    //   bot transform  =  (botOff % botHW) - botHW → drifts right
    //
    // While dragging, `drag` (the live cursor Δx) is added on top as a
    // visual offset without touching the accumulators:
    //
    //   top effective  = topOff - drag    (drag right → top shifts right)
    //   bot effective  = botOff + drag    (drag right → bot shifts left)
    //
    // On release, drag is baked into the accumulators and a momentum value
    // is seeded from the fling velocity, decaying back to zero (≈ 0.7s half-life).
    // ────────────────────────────────────────────────────────────────────────

    const TOP_SPEED  = 95;   // px/s — top drifts left
    const BOT_SPEED  = 115;  // px/s — bot drifts right
    const MOM_HALF   = 0.7;  // seconds for momentum to halve

    let topHW = 1, botHW = 1;   // half-widths, set after images load
    let topOff = 0, botOff = 0; // accumulators

    let momentum = 0; // extra px/s; positive = rightward push

    // Drag state
    let dragging   = false;
    let drag       = 0;      // live cursor Δx from drag start
    let dragStartX = 0;
    let dragPrevX  = 0;
    let dragPrevT  = 0;
    let dragVel    = 0;      // velocity at pointer-up (px/s)

    function applyTransform() {
      const topEff = topOff - drag;
      const botEff = botOff + drag;
      const t = -(((topEff % topHW) + topHW) % topHW);
      const b =  (((botEff % botHW) + botHW) % botHW) - botHW;
      trackTop.style.transform = `translateX(${t}px)`;
      trackBot.style.transform = `translateX(${b}px)`;
    }

    // ─── Pointer handlers ────────────────────────────────────────────────────
    function pDown(x) {
      dragging   = true;
      dragStartX = x;
      dragPrevX  = x;
      dragPrevT  = performance.now();
      drag       = 0;
      dragVel    = 0;
      document.body.classList.add('dragging');
    }

    function pMove(x) {
      if (!dragging) return;
      const now = performance.now();
      const dt  = (now - dragPrevT) / 1000;
      if (dt > 0.004) {
        dragVel   = (x - dragPrevX) / dt;
        dragPrevX = x;
        dragPrevT = now;
      }
      drag = x - dragStartX;
    }

    function pUp() {
      if (!dragging) return;
      dragging = false;
      // Bake drag into accumulators so there's no position jump.
      topOff -= drag;
      botOff += drag;
      // Seed momentum from fling velocity.
      momentum = dragVel;
      drag = 0;
      document.body.classList.remove('dragging');
    }

    document.addEventListener('mousedown',  e => { e.preventDefault(); pDown(e.clientX); });
    document.addEventListener('mousemove',  e => pMove(e.clientX));
    document.addEventListener('mouseup',    ()  => pUp());
    document.addEventListener('mouseleave', ()  => pUp());

    document.addEventListener('touchstart', e => pDown(e.touches[0].clientX),         { passive: true });
    document.addEventListener('touchmove',  e => pMove(e.touches[0].clientX),         { passive: true });
    document.addEventListener('touchend',   e => pUp());

    // ─── Animation loop ──────────────────────────────────────────────────────
    let lastT = 0;

    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      // Decay momentum toward zero.
      if (momentum !== 0) {
        momentum *= Math.pow(0.5, dt / MOM_HALF);
        if (Math.abs(momentum) < 0.5) momentum = 0;
      }

      // Auto-scroll. Momentum (rightward) subtracts from the leftward top
      // speed and from the rightward bot speed — both bands slow and
      // reverse together, then settle back to idle.
      topOff += (TOP_SPEED - momentum) * dt;
      botOff += (BOT_SPEED - momentum) * dt;

      applyTransform();
      requestAnimationFrame(frame);
    }

    // ─── Init ────────────────────────────────────────────────────────────────
    const allImgs = [...document.querySelectorAll('.track img')];
    Promise.all(allImgs.map(img =>
      img.decode().catch(() => new Promise(res => {
        img.addEventListener('load',  res, { once: true });
        img.addEventListener('error', res, { once: true });
      }))
    )).then(() => {
      topHW = trackTop.scrollWidth / 2;
      botHW = trackBot.scrollWidth / 2;
      document.body.classList.add('ready');
      requestAnimationFrame(t => { lastT = t; frame(t); });
    });

    // Safety net in case a broken image stalls decoding.
    setTimeout(() => document.body.classList.add('ready'), 4000);
  </script>
</body>
</html>
