<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #404040;
      cursor: grab;
      user-select: none;
    }
    body.dragging { cursor: grabbing; }

    /* ── Infinite canvas ───────────────────────────────────────── */
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .item {
      position: absolute;
      cursor: pointer;
    }

    .item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Like button */
    .like-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .item:hover .like-btn {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Lightbox ──────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
    }
    #lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    /* ── Zoom hint ─────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 1s;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <div id="stage">
    <div id="canvas"></div>
  </div>

  <div id="lightbox">
    <span id="lightbox-close">&#x2715;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div id="hint">scroll to zoom &nbsp;·&nbsp; drag to pan</div>

  <script>
    // ── Heart SVG (fuller, rounder shape) ────────────────────────
    function heartSVG(filled) {
      return filled
        ? `<svg viewBox="0 0 24 24" width="13" height="13" fill="#ff4444" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
        : `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
    }

    // ── Seeded random (LCG) — same layout every load ──────────────
    function makeRng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        return s / 0xffffffff;
      };
    }

    // ── Layout constants ──────────────────────────────────────────
    const CANVAS_W   = 3200;
    const CANVAS_H   = 2600;
    const COLS       = 17;
    const ROWS       = 10;
    const MIN_H      = 90;
    const MAX_H      = 210;
    const PADDING    = 16;   // guaranteed gap between adjacent images

    // ── Pan / zoom state ──────────────────────────────────────────
    let zoom  = 0.4;   // overridden by centerCanvas()
    let panX  = 0;
    let panY  = 0;
    const MIN_ZOOM = 0.06;
    const MAX_ZOOM = 2.2;

    const stage  = document.getElementById('stage');
    const canvas = document.getElementById('canvas');

    canvas.style.width  = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';

    function applyTransform() {
      canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    }

    // Fit entire canvas in viewport on load
    function centerCanvas() {
      zoom = Math.min(
        window.innerWidth  / CANVAS_W,
        window.innerHeight / CANVAS_H
      ) * 0.94;
      panX = (window.innerWidth  - CANVAS_W * zoom) / 2;
      panY = (window.innerHeight - CANVAS_H * zoom) / 2;
      applyTransform();
    }

    // ── Build layout from manifest ────────────────────────────────
    fetch('../manifest.json')
      .then(r => r.json())
      .then(manifest => {
        const rng = makeRng(0xc0ffee);
        const cellW = CANVAS_W / COLS;
        const cellH = CANVAS_H / ROWS;

        // Shuffle manifest with seeded rng so scatter is repeatable
        const items = manifest.slice();
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }

        items.forEach((entry, idx) => {
          const col = idx % COLS;
          const row = Math.floor(idx / COLS) % ROWS;

          // Pre-generate all random values now (seeded, so layout is deterministic)
          const displayH  = MIN_H + rng() * (MAX_H - MIN_H);
          const relPosX   = rng(); // 0–1, scaled to safe range after load
          const relPosY   = rng();

          const maxW = cellW - PADDING * 2;
          const maxH = cellH - PADDING * 2;

          const item = document.createElement('div');
          item.className = 'item';
          // Start offscreen; final position set after image loads
          item.style.left = '-9999px';
          item.style.top  = '-9999px';

          const img = document.createElement('img');
          img.src      = `../${entry.file}`;
          img.alt      = entry.title || '';
          img.loading  = 'eager';
          img.decoding = 'async';

          function place() {
            const aspect = img.naturalWidth / img.naturalHeight || 1;
            let h = displayH;
            let w = h * aspect;
            // Clamp so image never exits its cell
            if (w > maxW) { w = maxW; h = w / aspect; }
            if (h > maxH) { h = maxH; w = h * aspect; }
            // Map relPos into the guaranteed-safe zone within the cell
            const x = col * cellW + PADDING + relPosX * Math.max(0, cellW - PADDING * 2 - w);
            const y = row * cellH + PADDING + relPosY * Math.max(0, cellH - PADDING * 2 - h);
            item.style.width  = Math.round(w) + 'px';
            item.style.height = Math.round(h) + 'px';
            item.style.left   = Math.round(x) + 'px';
            item.style.top    = Math.round(y) + 'px';
          }

          img.onload = place;
          img.onerror = place; // still place on error so broken images don't block layout
          if (img.complete && img.naturalWidth) place(); // already cached

          const likeBtn = document.createElement('button');
          likeBtn.className = 'like-btn';
          likeBtn.innerHTML = heartSVG(false);
          likeBtn.addEventListener('click', e => {
            e.stopPropagation();
            likeBtn.classList.toggle('liked');
            likeBtn.innerHTML = heartSVG(likeBtn.classList.contains('liked'));
          });

          item.appendChild(img);
          item.appendChild(likeBtn);
          item.addEventListener('click', () => {
            if (!didDrag) openLightbox(`../${entry.file}`, entry.title);
          });

          canvas.appendChild(item);
        });

        centerCanvas();
      });

    // ── Zoom on scroll ────────────────────────────────────────────
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      // Keep point under cursor fixed
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      panX = cx - (cx - panX) * (newZoom / zoom);
      panY = cy - (cy - panY) * (newZoom / zoom);
      zoom = newZoom;
      applyTransform();
      dismissHint();
    }, { passive: false });

    // ── Pan on drag ───────────────────────────────────────────────
    let dragging = false;
    let didDrag  = false;
    let dragStartX, dragStartY, panStartX, panStartY;

    stage.addEventListener('mousedown', e => {
      dragging   = true;
      didDrag    = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      panStartX  = panX;
      panStartY  = panY;
      document.body.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
      panX = panStartX + dx;
      panY = panStartY + dy;
      applyTransform();
      dismissHint();
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      document.body.classList.remove('dragging');
    });

    // Touch pan
    let lastTouchX, lastTouchY;
    let lastPinchDist = null;

    stage.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        didDrag = false;
      }
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    stage.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
        panX += dx; panY += dy;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        applyTransform();
      }
      if (e.touches.length === 2 && lastPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor  = dist / lastPinchDist;
        const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = cx - (cx - panX) * (newZoom / zoom);
        panY = cy - (cy - panY) * (newZoom / zoom);
        zoom = newZoom;
        lastPinchDist = dist;
        applyTransform();
      }
      dismissHint();
    }, { passive: false });

    stage.addEventListener('touchend', () => { lastPinchDist = null; });

    // ── Lightbox ──────────────────────────────────────────────────
    const lightbox    = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src, title) {
      lightboxImg.src = src;
      lightboxImg.alt = title || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Hint ──────────────────────────────────────────────────────
    const hint = document.getElementById('hint');
    let hintTimer = setTimeout(() => hint.classList.add('hidden'), 4000);
    function dismissHint() {
      clearTimeout(hintTimer);
      hint.classList.add('hidden');
    }
  </script>
</body>
</html>
