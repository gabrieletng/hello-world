<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0d0d;
      cursor: grab;
      user-select: none;
    }
    body.dragging { cursor: grabbing; }

    /* ── Infinite canvas ───────────────────────────────────────── */
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .item {
      position: absolute;
      cursor: pointer;
    }

    .item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Like button */
    .like-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.55);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .item:hover .like-btn {
      opacity: 1;
      pointer-events: auto;
    }
    .like-btn.liked { color: #ff4444; }

    /* ── Lightbox ──────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
    }
    #lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    /* ── Zoom hint ─────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 1s;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <div id="stage">
    <div id="canvas"></div>
  </div>

  <div id="lightbox">
    <span id="lightbox-close">&#x2715;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div id="hint">scroll to zoom &nbsp;·&nbsp; drag to pan</div>

  <script>
    // ── Seeded random (LCG) — same layout every load ──────────────
    function makeRng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        return s / 0xffffffff;
      };
    }

    // ── Layout constants ──────────────────────────────────────────
    const CANVAS_W   = 3200;
    const CANVAS_H   = 2600;
    const COLS       = 17;
    const ROWS       = 10;
    const MIN_H      = 100;
    const MAX_H      = 260;
    const PADDING    = 12;   // min gap between cell images

    // ── Pan / zoom state ──────────────────────────────────────────
    let zoom  = 0.4;   // overridden by centerCanvas()
    let panX  = 0;
    let panY  = 0;
    const MIN_ZOOM = 0.06;
    const MAX_ZOOM = 2.2;

    const stage  = document.getElementById('stage');
    const canvas = document.getElementById('canvas');

    canvas.style.width  = CANVAS_W + 'px';
    canvas.style.height = CANVAS_H + 'px';

    function applyTransform() {
      canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    }

    // Fit entire canvas in viewport on load
    function centerCanvas() {
      zoom = Math.min(
        window.innerWidth  / CANVAS_W,
        window.innerHeight / CANVAS_H
      ) * 0.94;
      panX = (window.innerWidth  - CANVAS_W * zoom) / 2;
      panY = (window.innerHeight - CANVAS_H * zoom) / 2;
      applyTransform();
    }

    // ── Build layout from manifest ────────────────────────────────
    fetch('../manifest.json')
      .then(r => r.json())
      .then(manifest => {
        const rng = makeRng(0xc0ffee);
        const cellW = CANVAS_W / COLS;
        const cellH = CANVAS_H / ROWS;

        // Shuffle manifest with seeded rng so scatter is repeatable
        const items = manifest.slice();
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }

        items.forEach((entry, idx) => {
          const col = idx % COLS;
          const row = Math.floor(idx / COLS) % ROWS;

          // Random position within cell with padding margin
          const margin = PADDING;
          const x = col * cellW + margin + rng() * (cellW - margin * 2);
          const y = row * cellH + margin + rng() * (cellH - margin * 2);

          // Random display height; width will be set after image loads
          const displayH = MIN_H + rng() * (MAX_H - MIN_H);

          const item = document.createElement('div');
          item.className = 'item';
          item.style.left   = Math.round(x) + 'px';
          item.style.top    = Math.round(y) + 'px';
          item.style.height = Math.round(displayH) + 'px';
          item.style.width  = Math.round(displayH) + 'px'; // temp square, fixed on load

          const img = document.createElement('img');
          img.src     = `../${entry.file}`;
          img.alt     = entry.title || '';
          img.loading = 'eager';
          img.decoding = 'async';
          img.onload = () => {
            // Correct width once aspect ratio is known
            item.style.width = Math.round(displayH * (img.naturalWidth / img.naturalHeight)) + 'px';
          };

          const likeBtn = document.createElement('button');
          likeBtn.className = 'like-btn';
          likeBtn.textContent = '♡';
          likeBtn.addEventListener('click', e => {
            e.stopPropagation();
            likeBtn.classList.toggle('liked');
            likeBtn.textContent = likeBtn.classList.contains('liked') ? '♥' : '♡';
          });

          item.appendChild(img);
          item.appendChild(likeBtn);
          item.addEventListener('click', () => {
            if (!didDrag) openLightbox(`../${entry.file}`, entry.title);
          });

          canvas.appendChild(item);
        });

        centerCanvas();
      });

    // ── Zoom on scroll ────────────────────────────────────────────
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      // Keep point under cursor fixed
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      panX = cx - (cx - panX) * (newZoom / zoom);
      panY = cy - (cy - panY) * (newZoom / zoom);
      zoom = newZoom;
      applyTransform();
      dismissHint();
    }, { passive: false });

    // ── Pan on drag ───────────────────────────────────────────────
    let dragging = false;
    let didDrag  = false;
    let dragStartX, dragStartY, panStartX, panStartY;

    stage.addEventListener('mousedown', e => {
      dragging   = true;
      didDrag    = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      panStartX  = panX;
      panStartY  = panY;
      document.body.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
      panX = panStartX + dx;
      panY = panStartY + dy;
      applyTransform();
      dismissHint();
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      document.body.classList.remove('dragging');
    });

    // Touch pan
    let lastTouchX, lastTouchY;
    let lastPinchDist = null;

    stage.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        didDrag = false;
      }
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    stage.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTouchX;
        const dy = e.touches[0].clientY - lastTouchY;
        if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
        panX += dx; panY += dy;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        applyTransform();
      }
      if (e.touches.length === 2 && lastPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor  = dist / lastPinchDist;
        const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = cx - (cx - panX) * (newZoom / zoom);
        panY = cy - (cy - panY) * (newZoom / zoom);
        zoom = newZoom;
        lastPinchDist = dist;
        applyTransform();
      }
      dismissHint();
    }, { passive: false });

    stage.addEventListener('touchend', () => { lastPinchDist = null; });

    // ── Lightbox ──────────────────────────────────────────────────
    const lightbox    = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src, title) {
      lightboxImg.src = src;
      lightboxImg.alt = title || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Hint ──────────────────────────────────────────────────────
    const hint = document.getElementById('hint');
    let hintTimer = setTimeout(() => hint.classList.add('hidden'), 4000);
    function dismissHint() {
      clearTimeout(hintTimer);
      hint.classList.add('hidden');
    }
  </script>
</body>
</html>
