<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1E1E1E;
      cursor: grab;
      user-select: none;
    }
    body.dragging { cursor: grabbing; }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .item {
      position: absolute;
      cursor: pointer;
    }
    .item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .like-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .item:hover .like-btn { opacity: 1; pointer-events: auto; }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      cursor: default;
      pointer-events: none;
    }
    #lightbox-close {
      position: fixed;
      top: 18px; right: 22px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    #hint {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.22);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 1s;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <div id="stage">
    <div id="canvas"></div>
  </div>

  <div id="lightbox">
    <span id="lightbox-close">&#x2715;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div id="hint">scroll to zoom &nbsp;·&nbsp; drag to pan</div>

  <script>
    // ── Layout rule ───────────────────────────────────────────────
    // Each image is assigned a random size, then placed at a random
    // position. If it overlaps any already-placed image (+ GAP margin),
    // a new random position is tried. Up to MAX_TRIES attempts per image.
    // Canvas dimensions are computed from actual content so density stays
    // consistent regardless of image count or aspect ratios.
    // Layout is random on every load — no seed.

    const MIN_H    = 70;
    const MAX_H    = 260;
    const MAX_W    = 380;
    const GAP      = 10;       // minimum px between any two images
    const DENSITY  = 0.46;     // ratio of image area to canvas area (RSA jamming ~50%, stay well under)
    const MAX_TRIES = 1200;    // rejection attempts per image before giving up

    // ── Pan / zoom ────────────────────────────────────────────────
    let zoom = 0.4, panX = 0, panY = 0;
    const MIN_ZOOM = 0.05, MAX_ZOOM = 2.5;

    const stage  = document.getElementById('stage');
    const canvas = document.getElementById('canvas');

    function applyTransform() {
      canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    }

    function fitCanvas(w, h) {
      zoom = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.94;
      panX = (window.innerWidth  - w * zoom) / 2;
      panY = (window.innerHeight - h * zoom) / 2;
      applyTransform();
    }

    // ── Heart SVG ─────────────────────────────────────────────────
    const PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
    function heartSVG(filled) {
      return filled
        ? `<svg viewBox="0 0 24 24" width="13" height="13" fill="#ff4444"><path d="${PATH}"/></svg>`
        : `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linejoin="round"><path d="${PATH}"/></svg>`;
    }

    // ── Build layout ──────────────────────────────────────────────
    fetch('../manifest.json')
      .then(r => r.json())
      .then(manifest => {

        // 1. Load all images → get actual aspect ratios, assign random sizes
        return Promise.all(manifest.map(entry => new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            const asp = img.naturalWidth / img.naturalHeight || 1;
            let h = MIN_H + Math.random() * (MAX_H - MIN_H);
            let w = h * asp;
            if (w > MAX_W) { w = MAX_W; h = w / asp; }
            resolve({ w: Math.round(w), h: Math.round(h), img, entry });
          };
          img.onerror = () => resolve({ w: 120, h: 90, img, entry });
          img.src = `../${entry.file}`;
        })));

      }).then(imageData => {

        // 2. Shuffle, then sort largest-first so big images claim space when canvas is emptiest.
        // Positions are still fully random; only placement sequence changes.
        for (let i = imageData.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [imageData[i], imageData[j]] = [imageData[j], imageData[i]];
        }
        imageData.sort((a, b) => b.w * b.h - a.w * a.h);

        // 3. Canvas size derived from actual image areas + target density
        const totalArea = imageData.reduce((s, d) => s + d.w * d.h, 0);
        const canvasArea = totalArea / DENSITY;
        const CW = Math.ceil(Math.sqrt(canvasArea * 1.35));  // slightly wider than tall
        const CH = Math.ceil(Math.sqrt(canvasArea / 1.35));

        canvas.style.width  = CW + 'px';
        canvas.style.height = CH + 'px';

        // 4. Place each image: random position, reject if overlapping
        const placed = [];

        for (const d of imageData) {
          let x = 0, y = 0, ok = false;

          for (let t = 0; t < MAX_TRIES; t++) {
            x = GAP + Math.random() * Math.max(1, CW - d.w - GAP * 2);
            y = GAP + Math.random() * Math.max(1, CH - d.h - GAP * 2);

            ok = true;
            for (const p of placed) {
              if (x           < p.x + p.w + GAP &&
                  x + d.w + GAP > p.x           &&
                  y           < p.y + p.h + GAP &&
                  y + d.h + GAP > p.y) {
                ok = false;
                break;
              }
            }
            if (ok) break;
          }

          placed.push({ x: Math.round(x), y: Math.round(y), ...d });
        }

        // 5. Build DOM from computed positions
        for (const p of placed) {
          const item = document.createElement('div');
          item.className = 'item';
          item.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;

          p.img.draggable = false;
          item.appendChild(p.img);

          const likeBtn = document.createElement('button');
          likeBtn.className = 'like-btn';
          likeBtn.innerHTML = heartSVG(false);
          likeBtn.addEventListener('click', e => {
            e.stopPropagation();
            likeBtn.classList.toggle('liked');
            likeBtn.innerHTML = heartSVG(likeBtn.classList.contains('liked'));
          });
          item.appendChild(likeBtn);

          item.addEventListener('click', () => {
            if (!didDrag) openLightbox(`../${p.entry.file}`, p.entry.title);
          });

          canvas.appendChild(item);
        }

        fitCanvas(CW, CH);

      });

    // ── Zoom on scroll ────────────────────────────────────────────
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      panX = cx - (cx - panX) * (newZoom / zoom);
      panY = cy - (cy - panY) * (newZoom / zoom);
      zoom = newZoom;
      applyTransform();
      dismissHint();
    }, { passive: false });

    // ── Pan on drag (with kinetic inertia) ───────────────────────
    const COAST_HALF = 0.38;  // seconds for velocity to halve after release
    const COAST_MIN  = 1.5;   // px/s below which coast stops

    let dragging = false, didDrag = false;
    let dragStartX, dragStartY, panStartX, panStartY;
    let velX = 0, velY = 0, prevX, prevY, prevT;
    let coastRaf = null;

    function stopCoast() { if (coastRaf) { cancelAnimationFrame(coastRaf); coastRaf = null; } }

    function launchCoast() {
      stopCoast();
      let lastT = performance.now();
      function coast(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        const decay = Math.pow(0.5, dt / COAST_HALF);
        velX *= decay; velY *= decay;
        if (Math.abs(velX) < COAST_MIN && Math.abs(velY) < COAST_MIN) { coastRaf = null; return; }
        panX += velX * dt; panY += velY * dt;
        applyTransform();
        coastRaf = requestAnimationFrame(coast);
      }
      coastRaf = requestAnimationFrame(coast);
    }

    stage.addEventListener('mousedown', e => {
      stopCoast();
      dragging = true; didDrag = false;
      dragStartX = e.clientX; dragStartY = e.clientY;
      panStartX = panX; panStartY = panY;
      prevX = e.clientX; prevY = e.clientY; prevT = performance.now();
      velX = 0; velY = 0;
      document.body.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
      panX = panStartX + dx; panY = panStartY + dy;
      applyTransform(); dismissHint();
      const now = performance.now(), dt = (now - prevT) / 1000;
      if (dt > 0.004) {
        velX = (e.clientX - prevX) / dt; velY = (e.clientY - prevY) / dt;
        prevX = e.clientX; prevY = e.clientY; prevT = now;
      }
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('dragging');
      if (Math.abs(velX) > COAST_MIN || Math.abs(velY) > COAST_MIN) launchCoast();
    });

    // Touch
    let lastTX, lastTY, lastPinch = null;
    let tVelX = 0, tVelY = 0, tPrevX, tPrevY, tPrevT;
    stage.addEventListener('touchstart', e => {
      stopCoast();
      if (e.touches.length === 1) {
        lastTX = tPrevX = e.touches[0].clientX;
        lastTY = tPrevY = e.touches[0].clientY;
        tPrevT = performance.now();
        tVelX = 0; tVelY = 0; didDrag = false;
      }
      if (e.touches.length === 2) lastPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }, { passive: true });
    stage.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastTX, dy = e.touches[0].clientY - lastTY;
        if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;
        panX += dx; panY += dy;
        lastTX = e.touches[0].clientX; lastTY = e.touches[0].clientY;
        applyTransform();
        const now = performance.now(), dt = (now - tPrevT) / 1000;
        if (dt > 0.004) {
          tVelX = (e.touches[0].clientX - tPrevX) / dt;
          tVelY = (e.touches[0].clientY - tPrevY) / dt;
          tPrevX = e.touches[0].clientX; tPrevY = e.touches[0].clientY; tPrevT = now;
        }
      }
      if (e.touches.length === 2 && lastPinch) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const nz = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * dist / lastPinch));
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        panX = cx - (cx - panX) * (nz / zoom);
        panY = cy - (cy - panY) * (nz / zoom);
        zoom = nz; lastPinch = dist;
        applyTransform();
      }
      dismissHint();
    }, { passive: false });
    stage.addEventListener('touchend', e => {
      lastPinch = null;
      if (e.touches.length === 0) {
        velX = tVelX; velY = tVelY;
        if (Math.abs(velX) > COAST_MIN || Math.abs(velY) > COAST_MIN) launchCoast();
      }
    });

    // ── Lightbox ──────────────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src, title) {
      lightboxImg.src = src; lightboxImg.alt = title || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightbox.classList.remove('open'); lightboxImg.src = '';
    }
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Hint ──────────────────────────────────────────────────────
    const hint = document.getElementById('hint');
    let hintTimer = setTimeout(() => hint.classList.add('hidden'), 4000);
    function dismissHint() { clearTimeout(hintTimer); hint.classList.add('hidden'); }
  </script>
</body>
</html>
