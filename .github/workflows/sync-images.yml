name: Sync Images

on:
  push:
    branches: [ main ]
    paths:
      - 'ethos/**'
      - '.github/workflows/sync-images.yml'
      - 'scripts/optimize.py'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Optimize new images
        run: python3 scripts/optimize.py /github/workspace/ethos/
        continue-on-error: true

      - name: Update manifest
        run: python3 scripts/update-manifest.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/ manifest.json
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto: sync optimized images and update manifest"
            git push origin main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
