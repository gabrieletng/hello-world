name: Sync Images

on:
  push:
    branches: [ main ]
    paths:
      - 'ethos/**'
      - '.github/workflows/sync-images.yml'
      - 'scripts/optimize.py'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Optimize new images
        run: python3 scripts/optimize.py /github/workspace/ethos/

      - name: Update manifest
        run: python3 scripts/update-manifest.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/ manifest.json
          git diff-index --quiet HEAD || git commit -m "Auto: sync optimized images and update manifest"

      - name: Push changes
        run: git push origin main
