  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · A Story of Love and Death</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #1E1E1E;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; }

    a { color: inherit; text-decoration: none; }

    /* ── State visibility ── */
    #loading, #signed-out, #signed-in { display: none; }
    body[data-state="loading"] #loading { display: flex; }
    body[data-state="signed-out"] #signed-out { display: flex; }
    body[data-state="signed-in"] #signed-in { display: block; }

    /* ── Loading ── */
    #loading, #signed-out {
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 20px;
      text-align: center;
    }
    #loading-text {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── Signed-out ── */
    #signed-out h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    #signed-out p {
      color: rgba(255,255,255,0.55);
      font-size: 17px;
      letter-spacing: 0.08em;
      max-width: 420px;
      line-height: 1.45;
      margin-bottom: 32px;
    }
    .g-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      padding: 12px 22px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 17px;
      letter-spacing: 0.1em;
      transition: transform 0.15s, opacity 0.15s;
    }
    .g-btn:hover { transform: translateY(-1px); }
    .g-btn:disabled { opacity: 0.6; cursor: wait; }
    .g-btn svg { width: 18px; height: 18px; }
    #signed-out .back {
      margin-top: 28px;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #signed-out .back:hover { color: rgba(255,255,255,0.8); }

    /* ── Signed-in ── */
    #signed-in {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 44px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .user {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .user-text { min-width: 0; }
    .user-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.06em;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-email {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .ghost-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.8);
      padding: 9px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.06em;
      transition: all 0.2s;
    }
    .ghost-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }

    section { margin-bottom: 56px; }
    section:last-child { margin-bottom: 0; }
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 18px;
    }
    .section-head h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.1em;
    }
    .section-head .count {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 3px;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .grid-item:hover img { transform: scale(1.04); }
    .grid-item .play-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .empty {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      padding: 28px 0;
      letter-spacing: 0.04em;
    }
    .error {
      color: #ffb4b4;
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.25);
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 13px;
      letter-spacing: 0.04em;
      line-height: 1.5;
      word-break: break-word;
    }

    /* ── Lightbox (mirrors explore/grid.html) ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 100;
      align-items: safe center;
      justify-content: safe center;
      cursor: zoom-out;
      overflow-y: auto;
    }
    #lightbox.open { display: flex; }
    #lightbox-close {
      position: fixed;
      top: 18px; right: 22px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      z-index: 110;
    }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      padding: 24px 10px;
      user-select: none;
      transition: color 0.15s;
      z-index: 101;
    }
    .lightbox-nav svg { display: block; width: 32px; height: 32px; }
    .lightbox-nav:hover { color: #fff; }
    #lightbox-prev { left: 16px; }
    #lightbox-next { right: 16px; }

    #lightbox-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 95vw;
      padding: 40px 20px;
      cursor: default;
    }
    #lightbox-img, #lightbox-video {
      max-width: min(92vw, calc(100vw - 170px));
      max-height: 75vh;
      object-fit: contain;
    }
    #lightbox-video { background: #000; }
    #lightbox-title {
      font-size: 28px;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.15;
      max-width: min(92vw, calc(100vw - 170px));
    }
    #lightbox-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .lightbox-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .lightbox-btn:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
    }
    .lightbox-like-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
    }
    .lightbox-like-btn svg { display: block; }

    #lightbox-notes {
      max-width: 600px;
      width: 100%;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 20px;
    }
    #lightbox-notes-header {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }
    #lightbox-notes-list {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .note-item {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .note-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }
    .note-body { flex: 1; }
    .note-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .note-author { font-size: 12px; color: rgba(255,255,255,0.9); }
    .note-time { font-size: 10px; color: rgba(255,255,255,0.4); }
    .note-delete {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      margin-left: auto;
    }
    .note-delete:hover { color: rgba(255,255,255,0.7); }
    .note-text {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      word-wrap: break-word;
      letter-spacing: 0.02em;
    }
    #lightbox-notes-message {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 12px 0;
    }
    #lightbox-notes-input-section {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #notes-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }
    #lightbox-notes-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 0;
      font-size: 13px;
      outline: none;
      letter-spacing: 0.02em;
    }
    #lightbox-notes-input:focus { border-bottom-color: rgba(255,255,255,0.5); }
    #lightbox-notes-input::placeholder { color: rgba(255,255,255,0.3); }
    #lightbox-notes-submit {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.35);
      padding: 0;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    #lightbox-notes-submit.active { color: #fff; }

    #lightbox-video::-webkit-media-controls-fullscreen-button {
      display: none !important;
    }
    #lightbox-media {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    #lightbox-fullscreen {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.8);
      border-radius: 4px;
      cursor: pointer;
      z-index: 110;
      transition: opacity 0.3s, background 0.2s, color 0.2s, border-color 0.2s;
    }
    #lightbox-fullscreen:hover {
      background: rgba(0,0,0,0.75);
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }
    #lightbox-fullscreen svg { display: block; width: 16px; height: 16px; }

    #lightbox-controls-bar {
      position: fixed;
      bottom: 22px; left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 110;
      transition: opacity 0.3s;
    }
    #lightbox-playpause {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.85);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #lightbox-playpause:hover {
      background: rgba(0,0,0,0.8);
      color: #fff;
      border-color: rgba(255,255,255,0.6);
    }
    #lightbox-playpause svg { display: block; width: 20px; height: 20px; }

    #lightbox-speed {
      height: 36px;
      min-width: 48px;
      padding: 0 14px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.85);
      border-radius: 18px;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #lightbox-speed:hover {
      background: rgba(0,0,0,0.8);
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    #lightbox-progress {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: rgba(255,255,255,0.12);
      display: none;
      z-index: 109;
      transition: opacity 0.3s;
    }
    #lightbox-progress .bar {
      height: 100%;
      width: 0%;
      background: rgba(255,255,255,0.9);
    }

    #lightbox.carousel {
      background: #000;
      overflow: hidden;
    }
    #lightbox.carousel #lightbox-container {
      padding: 0;
      max-width: none;
      gap: 0;
    }
    #lightbox.carousel #lightbox-img,
    #lightbox.carousel #lightbox-video {
      max-width: 100vw;
      max-height: 100vh;
    }
    #lightbox.carousel #lightbox-title,
    #lightbox.carousel #lightbox-actions,
    #lightbox.carousel #lightbox-notes { display: none; }
    #lightbox.carousel #lightbox-controls-bar { display: flex; }
    #lightbox.carousel #lightbox-progress { display: block; }

    #lightbox.carousel.idle #lightbox-fullscreen,
    #lightbox.carousel.idle #lightbox-controls-bar,
    #lightbox.carousel.idle #lightbox-progress,
    #lightbox.carousel.idle #lightbox-close,
    #lightbox.carousel.idle #lightbox-prev,
    #lightbox.carousel.idle #lightbox-next {
      opacity: 0;
      pointer-events: none;
    }

    #lightbox.carousel.idle { cursor: none; }
    #lightbox.carousel.idle * { cursor: none !important; }
  </style>
</head>
<body data-state="loading">

  <div id="loading">
    <div id="loading-text">Loading profile…</div>
  </div>

  <div id="signed-out">
    <h1>Your Collection</h1>
    <p>Sign in with Google to see the images you've liked and the notes you've left.</p>
    <button id="sign-in-btn" class="g-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/>
      </svg>
      Sign in with Google
    </button>
    <a href="../explore/grid.html" class="back">← Back to the collection</a>
  </div>

  <div id="signed-in">
    <header>
      <div class="user">
        <div class="avatar" id="avatar">?</div>
        <div class="user-text">
          <div class="user-name" id="user-name">—</div>
          <div class="user-email" id="user-email"></div>
        </div>
      </div>
      <div class="header-actions">
        <a href="../explore/grid.html" class="ghost-btn">Collection</a>
        <button id="sign-out-btn" class="ghost-btn">Sign out</button>
      </div>
    </header>

    <section>
      <div class="section-head">
        <h2>Liked</h2>
        <span class="count" id="liked-count"></span>
      </div>
      <div id="liked-error" class="error" style="display:none;"></div>
      <div id="liked-grid" class="grid"></div>
      <div id="liked-empty" class="empty" style="display:none;">No likes yet — tap the heart on any image.</div>
    </section>

    <section>
      <div class="section-head">
        <h2>Noted</h2>
        <span class="count" id="noted-count"></span>
      </div>
      <div id="noted-error" class="error" style="display:none;"></div>
      <div id="noted-grid" class="grid"></div>
      <div id="noted-empty" class="empty" style="display:none;">No notes yet — write one from any image.</div>
    </section>
  </div>

  <div id="lightbox">
    <span id="lightbox-close">&#x2715;</span>
    <span id="lightbox-prev" class="lightbox-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="11,4 7,12 11,20"/></svg></span>
    <span id="lightbox-next" class="lightbox-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="13,4 17,12 13,20"/></svg></span>
    <div id="lightbox-container" onclick="if(!this.parentElement.classList.contains('carousel')) event.stopPropagation()">
      <div id="lightbox-media">
        <img id="lightbox-img" src="" alt="" style="display:none;" />
        <video id="lightbox-video" style="display:none" autoplay loop muted playsinline controls preload="metadata" controlslist="nofullscreen"></video>
        <button id="lightbox-fullscreen" title="Full screen" aria-label="Full screen"></button>
      </div>
      <div id="lightbox-meta">
        <div id="lightbox-title"></div>
        <div id="lightbox-actions">
          <button id="lightbox-like" class="lightbox-btn lightbox-like-btn"></button>
          <button id="lightbox-share" class="lightbox-btn">Share</button>
        </div>
      </div>
      <div id="lightbox-notes">
        <div id="lightbox-notes-header">Notes</div>
        <div id="lightbox-notes-list"></div>
        <div id="lightbox-notes-input-section">
          <div id="notes-user-avatar"></div>
          <input id="lightbox-notes-input" type="text" placeholder="Add a note..." maxlength="500" />
          <button id="lightbox-notes-submit">POST</button>
        </div>
      </div>
    </div>
    <div id="lightbox-controls-bar">
      <button id="lightbox-playpause" title="Play slideshow" aria-label="Play slideshow"></button>
      <button id="lightbox-speed" title="Image slideshow speed" aria-label="Slideshow speed"></button>
    </div>
    <div id="lightbox-progress"><div class="bar"></div></div>
  </div>

  <script type="module">
    import {
      signInGoogle,
      signOutUser,
      setupAuthStateListener,
      getCurrentUser,
      getUserLikedImages,
      getUserCommentedImages,
      addLike,
      removeLike,
      isImageLiked,
      addNote,
      getNotes,
      deleteNote
    } from '../js/firebase.js';
    import { track } from '../js/analytics.js';

    const body = document.body;
    const setState = s => body.dataset.state = s;

    // Safety: if Firebase auth never resolves (blocked, offline, etc.),
    // fall out of the loading state after 4s so the page is still usable.
    let authResolved = false;
    setTimeout(() => {
      if (!authResolved && body.dataset.state === 'loading') setState('signed-out');
    }, 4000);

    const PLAY_ICON = '<svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><polygon points="6,4 20,12 6,20"/></svg>';

    // ── Manifest ──
    const manifestPromise = fetch('../manifest.json')
      .then(r => r.json())
      .then(list => {
        const map = new Map();
        for (const e of list) map.set(e.file, e);
        return map;
      })
      .catch(err => {
        console.error('Manifest load failed:', err);
        return new Map();
      });

    // ── Sign-in / sign-out buttons ──
    const signInBtn = document.getElementById('sign-in-btn');
    const signOutBtn = document.getElementById('sign-out-btn');

    signInBtn.addEventListener('click', async () => {
      signInBtn.disabled = true;
      try {
        await signInGoogle();
      } catch (err) {
        console.error('Sign-in failed:', err);
        signInBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener('click', async () => {
      try { await signOutUser(); }
      catch (err) { console.error('Sign-out failed:', err); }
    });

    // Read ?image= once on load so we can auto-open the lightbox after grids render.
    // Matches grid.html so a shared profile URL lands directly on the picture + notes.
    const autoOpenImageFile = new URLSearchParams(window.location.search).get('image');

    // ── Auth state drives the whole page ──
    setupAuthStateListener(async user => {
      authResolved = true;
      if (!user) {
        setState('signed-out');
        signInBtn.disabled = false;
        return;
      }

      renderUser(user);
      setState('signed-in');

      const manifestMap = await manifestPromise;

      const [likedRes, notedRes] = await Promise.allSettled([
        getUserLikedImages(),
        getUserCommentedImages()
      ]);

      if (likedRes.status === 'fulfilled') {
        renderGrid({
          gridEl: document.getElementById('liked-grid'),
          emptyEl: document.getElementById('liked-empty'),
          countEl: document.getElementById('liked-count'),
          files: likedRes.value.map(d => d.imageFile),
          manifestMap,
          sectionName: 'liked'
        });
      } else {
        showError('liked-error', likedRes.reason);
      }

      if (notedRes.status === 'fulfilled') {
        renderGrid({
          gridEl: document.getElementById('noted-grid'),
          emptyEl: document.getElementById('noted-empty'),
          countEl: document.getElementById('noted-count'),
          files: notedRes.value,
          manifestMap,
          sectionName: 'noted'
        });
      } else {
        showError('noted-error', notedRes.reason);
      }

      if (autoOpenImageFile) {
        // Prefer Noted so deep-links from share land in the section the notes live in;
        // fall back to Liked, then manifest (image may be neither liked nor noted yet).
        const noted = sections.noted || [];
        const liked = sections.liked || [];
        const notedIdx = noted.findIndex(e => e.file === autoOpenImageFile);
        if (notedIdx >= 0) {
          openLightbox('noted', notedIdx);
        } else {
          const likedIdx = liked.findIndex(e => e.file === autoOpenImageFile);
          if (likedIdx >= 0) {
            openLightbox('liked', likedIdx);
          } else {
            const entry = manifestMap.get(autoOpenImageFile);
            if (entry) {
              sections.__deep = [entry];
              openLightbox('__deep', 0);
            }
          }
        }
      }
    });

    function showError(id, err) {
      console.error(err);
      const el = document.getElementById(id);
      el.textContent = `Couldn't load: ${err?.message || err}`;
      el.style.display = 'block';
    }

    function renderUser(user) {
      const avatar = document.getElementById('avatar');
      const nameEl = document.getElementById('user-name');
      const emailEl = document.getElementById('user-email');

      const name = user.displayName || user.email?.split('@')[0] || 'You';
      nameEl.textContent = name;
      emailEl.textContent = user.email || '';

      avatar.innerHTML = '';
      if (user.photoURL) {
        const img = document.createElement('img');
        img.src = user.photoURL;
        img.alt = name;
        img.referrerPolicy = 'no-referrer';
        avatar.appendChild(img);
      } else {
        avatar.textContent = name.charAt(0).toUpperCase();
      }
    }

    // Module state for the lightbox. `sections` keeps one entry list per
    // named section so prev/next only navigates within the user's current
    // scope (Liked or Noted, not cross-section or across the whole grid).
    const sections = {};

    function renderGrid({ gridEl, emptyEl, countEl, files, manifestMap, sectionName }) {
      gridEl.innerHTML = '';

      const entries = files
        .map(f => manifestMap.get(f))
        .filter(Boolean);

      sections[sectionName] = entries;

      countEl.textContent = entries.length ? String(entries.length) : '';

      if (entries.length === 0) {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      gridEl.style.display = 'grid';
      emptyEl.style.display = 'none';

      const frag = document.createDocumentFragment();
      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i];
        const item = document.createElement('div');
        item.className = 'grid-item';

        const img = document.createElement('img');
        img.src = `../${entry.file}`;
        img.alt = (entry.video || entry.file).split('/').pop();
        img.loading = 'lazy';
        item.appendChild(img);

        if (entry.video) {
          const badge = document.createElement('div');
          badge.className = 'play-badge';
          badge.innerHTML = PLAY_ICON;
          item.appendChild(badge);
        }

        item.addEventListener('click', () => openLightbox(sectionName, i));
        frag.appendChild(item);
      }
      gridEl.appendChild(frag);
    }

    // ────────────────────────────────────────────────────────────────
    // Lightbox — mirrors explore/grid.html so the user gets like/unlike,
    // share, notes (view + add + delete own), and prev/next navigation
    // within the current section, without leaving the profile page.
    // ────────────────────────────────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');
    const lightboxTitle = document.getElementById('lightbox-title');
    const lightboxLikeBtn = document.getElementById('lightbox-like');
    const lightboxShareBtn = document.getElementById('lightbox-share');
    const lightboxNotesList = document.getElementById('lightbox-notes-list');
    const lightboxNotesInput = document.getElementById('lightbox-notes-input');
    const lightboxNotesSubmit = document.getElementById('lightbox-notes-submit');
    const notesUserAvatar = document.getElementById('notes-user-avatar');
    const lightboxPrev = document.getElementById('lightbox-prev');
    const lightboxNext = document.getElementById('lightbox-next');

    const HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
    function heartSVG(filled, size = 18) {
      return filled
        ? `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="#ff4444"><path d="${HEART_PATH}"/></svg>`
        : `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linejoin="round"><path d="${HEART_PATH}"/></svg>`;
    }
    function renderHeart() {
      lightboxLikeBtn.innerHTML = heartSVG(lightboxLikeBtn.classList.contains('liked'));
    }
    renderHeart();

    let currentSection = null;  // 'liked' | 'noted'
    let currentIndex = -1;
    let currentEntry = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(date) {
      const now = new Date();
      const diff = now - date;
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      return date.toLocaleDateString();
    }

    async function loadNotes() {
      if (!currentEntry) return;
      try {
        const notes = await getNotes(currentEntry.file);
        lightboxNotesList.innerHTML = '';
        if (notes.length === 0) {
          lightboxNotesList.innerHTML = '<div id="lightbox-notes-message">No notes yet. Be the first to add one!</div>';
          return;
        }
        const user = getCurrentUser();
        for (const note of notes) {
          const noteEl = document.createElement('div');
          noteEl.className = 'note-item';
          const isOwner = user && user.uid === note.userId;
          const initials = (note.displayName || 'U').charAt(0).toUpperCase();
          noteEl.innerHTML = `
            <div class="note-avatar">${initials}</div>
            <div class="note-body">
              <div class="note-meta">
                <span class="note-author">${escapeHtml(note.displayName || 'Anonymous')}</span>
                <span class="note-time">${formatTime(note.createdAt)}</span>
                ${isOwner ? `<span class="note-delete" data-note-id="${note.id}">×</span>` : ''}
              </div>
              <div class="note-text">${escapeHtml(note.text)}</div>
            </div>`;
          if (isOwner) {
            noteEl.querySelector('.note-delete').addEventListener('click', async e => {
              e.stopPropagation();
              try {
                await deleteNote(note.id);
                await loadNotes();
              } catch (err) {
                console.error('Delete note failed:', err);
              }
            });
          }
          lightboxNotesList.appendChild(noteEl);
        }
      } catch (err) {
        console.error('Load notes failed:', err);
        lightboxNotesList.innerHTML = '<div id="lightbox-notes-message">Error loading notes</div>';
      }
    }

    async function openLightbox(sectionName, index) {
      const list = sections[sectionName];
      if (!list || !list[index]) return;
      currentSection = sectionName;
      currentIndex = index;
      currentEntry = list[index];

      const filename = (currentEntry.video || currentEntry.file).split('/').pop();
      if (currentEntry.video) {
        lightboxImg.style.display = 'none';
        lightboxImg.src = '';
        lightboxVideo.style.display = 'block';
        lightboxVideo.src = `../${currentEntry.video}`;
        lightboxVideo.poster = `../${currentEntry.file}`;
        lightboxVideo.load();
        lightboxVideo.play().catch(() => {});
      } else {
        lightboxVideo.pause();
        lightboxVideo.removeAttribute('src');
        lightboxVideo.load();
        lightboxVideo.style.display = 'none';
        lightboxImg.style.display = 'block';
        lightboxImg.src = `../${currentEntry.file}`;
        lightboxImg.alt = filename;
      }
      lightboxTitle.textContent = currentEntry.title || filename;

      lightboxLikeBtn.classList.remove('liked');
      try {
        if (await isImageLiked(currentEntry.file)) lightboxLikeBtn.classList.add('liked');
      } catch (err) {
        console.error('Check like failed:', err);
      }
      renderHeart();

      // Notes avatar for the input row
      const user = getCurrentUser();
      if (user) {
        const name = user.displayName || user.email || 'U';
        notesUserAvatar.textContent = name.charAt(0).toUpperCase();
      }

      lightboxNotesInput.value = '';
      lightboxNotesSubmit.classList.remove('active');
      await loadNotes();

      // URL state: matches grid.html so share/back work
      const url = new URL(window.location.href);
      url.searchParams.set('image', currentEntry.file);
      window.history.pushState({ image: currentEntry.file }, '', url.toString());

      lightbox.classList.add('open');
      if (carouselPlaying) advanceStart();
    }

    function closeLightbox() {
      if (lightbox.classList.contains('carousel')) exitCarousel();
      lightbox.classList.remove('open');
      lightboxImg.src = '';
      lightboxVideo.pause();
      lightboxVideo.loop = true;
      lightboxVideo.removeAttribute('src');
      lightboxVideo.load();
      currentSection = null;
      currentIndex = -1;
      currentEntry = null;
      const url = new URL(window.location.href);
      url.searchParams.delete('image');
      window.history.pushState({}, '', url.toString());
    }

    function navigate(dir) {
      if (!currentSection) return;
      const list = sections[currentSection];
      if (!list || !list.length) return;
      const next = (currentIndex + dir + list.length) % list.length;
      openLightbox(currentSection, next);
    }

    lightbox.addEventListener('click', e => {
      if (lightbox.classList.contains('carousel')) {
        const interactive = e.target.closest('button, video, #lightbox-close, .lightbox-nav');
        if (!interactive) {
          if (lightbox.classList.contains('idle')) {
            resetIdle();
          } else {
            clearTimeout(idleTimer);
            lightbox.classList.add('idle');
          }
        }
        return;
      }
      if (e.target === lightbox) closeLightbox();
    });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', e => { e.stopPropagation(); navigate(-1); });
    lightboxNext.addEventListener('click', e => { e.stopPropagation(); navigate(1); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('carousel')) exitCarousel();
        else closeLightbox();
      }
      else if (e.key === 'ArrowLeft') navigate(-1);
      else if (e.key === 'ArrowRight') navigate(1);
      else if (e.key === ' ' && lightbox.classList.contains('carousel')) {
        e.preventDefault();
        if (carouselPlaying) pauseCarousel(); else playCarousel();
      }
    });

    // ── Carousel (screensaver) mode ──────────────────────────────
    const lightboxFullscreenBtn = document.getElementById('lightbox-fullscreen');
    const lightboxPlayPauseBtn = document.getElementById('lightbox-playpause');
    const lightboxSpeedBtn = document.getElementById('lightbox-speed');
    const lightboxProgressBar = document.querySelector('#lightbox-progress .bar');
    const SPEED_OPTIONS_MS = [3000, 5000, 8000, 12000];
    let speedIdx = 1;
    let carouselPlaying = false;
    let carouselRAF = null;
    let carouselStart = 0;
    let idleTimer = null;

    function renderSpeed() { lightboxSpeedBtn.textContent = (SPEED_OPTIONS_MS[speedIdx] / 1000) + 's'; }
    renderSpeed();

    const ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>';
    const ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M9 20v-5H4"/><path d="M15 20v-5h5"/></svg>';
    const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

    lightboxFullscreenBtn.innerHTML = ICON_EXPAND;
    lightboxPlayPauseBtn.innerHTML = ICON_PLAY;

    function enterCarousel() {
      lightbox.classList.add('carousel');
      lightboxFullscreenBtn.innerHTML = ICON_COLLAPSE;
      lightboxFullscreenBtn.title = 'Exit full screen';
      if (lightbox.requestFullscreen) lightbox.requestFullscreen().catch(() => {});
      resetIdle();
    }
    function exitCarousel() {
      pauseCarousel();
      lightbox.classList.remove('carousel', 'idle');
      lightboxFullscreenBtn.innerHTML = ICON_EXPAND;
      lightboxFullscreenBtn.title = 'Full screen';
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
    function playCarousel() {
      carouselPlaying = true;
      lightboxPlayPauseBtn.innerHTML = ICON_PAUSE;
      lightboxPlayPauseBtn.title = 'Pause slideshow';
      advanceStart();
    }
    function pauseCarousel() {
      carouselPlaying = false;
      lightboxPlayPauseBtn.innerHTML = ICON_PLAY;
      lightboxPlayPauseBtn.title = 'Play slideshow';
      if (carouselRAF) cancelAnimationFrame(carouselRAF);
      carouselRAF = null;
      if (currentEntry && currentEntry.video) lightboxVideo.pause();
      lightboxProgressBar.style.width = '0%';
    }
    function advanceStart() {
      lightboxProgressBar.style.width = '0%';
      if (carouselRAF) cancelAnimationFrame(carouselRAF);
      if (currentEntry && currentEntry.video) {
        lightboxVideo.loop = false;
        lightboxVideo.currentTime = 0;
        lightboxVideo.play().catch(() => {});
      } else {
        carouselStart = performance.now();
        carouselRAF = requestAnimationFrame(tickImage);
      }
    }
    function tickImage(now) {
      if (!carouselPlaying || (currentEntry && currentEntry.video)) return;
      const interval = SPEED_OPTIONS_MS[speedIdx];
      const elapsed = now - carouselStart;
      const pct = Math.min(100, (elapsed / interval) * 100);
      lightboxProgressBar.style.width = pct + '%';
      if (elapsed >= interval) { navigate(1); return; }
      carouselRAF = requestAnimationFrame(tickImage);
    }
    function resetIdle() {
      lightbox.classList.remove('idle');
      clearTimeout(idleTimer);
      if (lightbox.classList.contains('carousel')) {
        idleTimer = setTimeout(() => lightbox.classList.add('idle'), 2500);
      }
    }

    lightboxVideo.addEventListener('timeupdate', () => {
      if (!carouselPlaying || !currentEntry || !currentEntry.video) return;
      if (!lightboxVideo.duration) return;
      const pct = Math.min(100, (lightboxVideo.currentTime / lightboxVideo.duration) * 100);
      lightboxProgressBar.style.width = pct + '%';
    });
    lightboxVideo.addEventListener('ended', () => {
      if (carouselPlaying) navigate(1);
    });

    lightboxFullscreenBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (lightbox.classList.contains('carousel')) exitCarousel();
      else enterCarousel();
    });
    lightboxPlayPauseBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (carouselPlaying) pauseCarousel(); else playCarousel();
    });
    lightboxSpeedBtn.addEventListener('click', e => {
      e.stopPropagation();
      speedIdx = (speedIdx + 1) % SPEED_OPTIONS_MS.length;
      renderSpeed();
      if (carouselPlaying && currentEntry && !currentEntry.video) advanceStart();
      resetIdle();
    });

    lightbox.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') resetIdle(); });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && lightbox.classList.contains('carousel')) {
        pauseCarousel();
        lightbox.classList.remove('carousel', 'idle');
        lightboxFullscreenBtn.innerHTML = ICON_EXPAND;
        lightboxFullscreenBtn.title = 'Full screen';
      }
    });

    lightboxLikeBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!currentEntry) return;
      const wasLiked = lightboxLikeBtn.classList.contains('liked');
      try {
        if (wasLiked) {
          await removeLike(currentEntry.file);
          // Remove from the liked list so the profile stays truthful.
          // If we're in the Liked section, also adjust index / close if empty.
          removeFromSection('liked', currentEntry.file);
          if (currentSection === 'liked') {
            const liked = sections.liked;
            if (!liked || liked.length === 0) { closeLightbox(); return; }
            currentIndex = Math.min(currentIndex, liked.length - 1);
            currentEntry = liked[currentIndex];
          }
          lightboxLikeBtn.classList.remove('liked');
        } else {
          await addLike(currentEntry.file);
          lightboxLikeBtn.classList.add('liked');
          // If it's not in the liked list yet, append it so the grid stays in sync
          addToSection('liked', currentEntry);
        }
        renderHeart();
      } catch (err) {
        console.error('Like toggle failed:', err);
      }
    });

    lightboxShareBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (!currentEntry) return;
      const stem = currentEntry.file.split('/').pop().replace(/\.webp$/, '');
      const url = new URL(`../explore/share/${stem}.html`, window.location.href).href;
      const text = `${currentEntry.title || 'Image'} – A Story of Love and Death`;
      const user = getCurrentUser();
      track('image_shared', {
        userId: user?.uid || null,
        displayName: user?.displayName || 'anonymous',
        imageFile: currentEntry.file,
        method: navigator.share ? 'native' : 'clipboard',
      });
      if (navigator.share) navigator.share({ title: text, url }).catch(() => {});
      else navigator.clipboard.writeText(url).catch(() => {});
    });

    lightboxNotesInput.addEventListener('input', () => {
      lightboxNotesSubmit.classList.toggle('active', lightboxNotesInput.value.trim().length > 0);
    });
    lightboxNotesInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); lightboxNotesSubmit.click(); }
    });
    lightboxNotesSubmit.addEventListener('click', async e => {
      e.stopPropagation();
      if (!currentEntry || !lightboxNotesInput.value.trim()) return;
      try {
        await addNote(currentEntry.file, lightboxNotesInput.value);
        lightboxNotesInput.value = '';
        lightboxNotesSubmit.classList.remove('active');
        await loadNotes();
        addToSection('noted', currentEntry);
      } catch (err) {
        console.error('Add note failed:', err);
        alert('Failed to add note: ' + err.message);
      }
    });

    // Keep section lists and their visible grids / counts in sync when the
    // user likes/unlikes or notes from inside the lightbox, so closing
    // the lightbox shows the correct state without a full reload.
    function rerenderSection(name) {
      if (name === 'liked') {
        renderGrid({
          gridEl: document.getElementById('liked-grid'),
          emptyEl: document.getElementById('liked-empty'),
          countEl: document.getElementById('liked-count'),
          files: sections.liked.map(e => e.file),
          manifestMap: new Map(sections.liked.map(e => [e.file, e])),
          sectionName: 'liked'
        });
      } else if (name === 'noted') {
        renderGrid({
          gridEl: document.getElementById('noted-grid'),
          emptyEl: document.getElementById('noted-empty'),
          countEl: document.getElementById('noted-count'),
          files: sections.noted.map(e => e.file),
          manifestMap: new Map(sections.noted.map(e => [e.file, e])),
          sectionName: 'noted'
        });
      }
    }
    function removeFromSection(name, file) {
      if (!sections[name]) return;
      sections[name] = sections[name].filter(e => e.file !== file);
      rerenderSection(name);
    }
    function addToSection(name, entry) {
      if (!sections[name]) sections[name] = [];
      if (sections[name].some(e => e.file === entry.file)) return;
      sections[name] = [entry, ...sections[name]];
      rerenderSection(name);
    }
  </script>
</body>
</html>
